services:
  catalogo:
    build:
      context: ./catalogo_service
      dockerfile: Dockerfile
    container_name: catalogo_service

    # ports:
    #   - "50051:50051"
    volumes:
      - catalogo_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/catalogo.db
      - GRPC_PORT=50051
    networks:
      - biblioteca_net

  prestamos:
    build:
      context: ./prestamos_service
      dockerfile: Dockerfile
    container_name: prestamos_service

    # ports:
    #   - "8000:8000"
    volumes:
      - prestamos_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/prestamos.db
      - CATALOGO_GRPC_HOST=catalogo
      - CATALOGO_GRPC_PORT=50051
      - SANCIONES_URL=${SANCIONES_URL:-http://sanciones:8000}
      - API_KEY=${API_KEY:-biblioteca_dev_key_2026}
    depends_on:
      - catalogo
      - sanciones
    networks:
      - biblioteca_net

  sanciones:
    build:
      context: ./sanciones_service
      dockerfile: Dockerfile
    container_name: sanciones_service

    # ports:
    #   - "8001:8000"
    volumes:
      - sanciones_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/sanciones.db
    networks:
      - biblioteca_net

  gateway:
    build:
      context: ./gateway_service
      dockerfile: Dockerfile
    container_name: gateway_service
    ports:
    - "8080:8080"
    environment:
      - PRESTAMOS_URL=http://prestamos:8000
      - API_KEY=${API_KEY:-biblioteca_dev_key_2026}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_cambiar}
    depends_on:
      - prestamos
    networks:
      - biblioteca_net

volumes:
  catalogo_data:
  prestamos_data:
  sanciones_data:

networks:
  biblioteca_net:
    name: biblioteca_net
    driver: bridge

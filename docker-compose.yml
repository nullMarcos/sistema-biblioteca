services:
  catalogo:
    build:
      context: .
      dockerfile: catalogo_service/Dockerfile
    volumes:
      - catalogo_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/catalogo.db
      - GRPC_PORT=50051
      - SQLITE_BUSY_TIMEOUT=${SQLITE_BUSY_TIMEOUT:-0.5}
    networks:
      - biblioteca_net
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; c=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(c).result(timeout=2); c.close()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  prestamos:
    build:
      context: .
      dockerfile: prestamos_service/Dockerfile
    volumes:
      - prestamos_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/prestamos.db
      - CATALOGO_GRPC_HOST=catalogo
      - CATALOGO_GRPC_PORT=50051
      - SANCIONES_URL=${SANCIONES_URL:-http://sanciones:8000}
      - API_KEY=${API_KEY:-biblioteca_dev_key_2026}
      - HABILITAR_FALLOS_DEMO=${HABILITAR_FALLOS_DEMO:-false}
      - SQLITE_BUSY_TIMEOUT=${SQLITE_BUSY_TIMEOUT:-0.5}
      - CATALOGO_TIMEOUT_SEGS=${CATALOGO_TIMEOUT_SEGS:-0.6}
      - CATALOGO_MAX_RETRIES=${CATALOGO_MAX_RETRIES:-1}
      - CATALOGO_INITIAL_BACKOFF_SEGS=${CATALOGO_INITIAL_BACKOFF_SEGS:-0.1}
      - SANCIONES_TIMEOUT_SEGS=${SANCIONES_TIMEOUT_SEGS:-1.5}
      - SANCIONES_CB_THRESHOLD=${SANCIONES_CB_THRESHOLD:-3}
      - SANCIONES_CB_RECOVERY_SEGS=${SANCIONES_CB_RECOVERY_SEGS:-5}
      - SANCIONES_MAX_CONCURRENT=${SANCIONES_MAX_CONCURRENT:-5}
      - SAGA_TIMEOUT_SEGS=${SAGA_TIMEOUT_SEGS:-8}
      - MAX_PRESTAMOS_POR_SOCIO=${MAX_PRESTAMOS_POR_SOCIO:-5}
      - SAGA_LEASE_SECONDS=${SAGA_LEASE_SECONDS:-30}
      - SAGA_RECUPERACION_MAX_INTENTOS=${SAGA_RECUPERACION_MAX_INTENTOS:-5}
      - SAGA_RECUPERACION_BACKOFF=${SAGA_RECUPERACION_BACKOFF:-1}
      - SAGA_RECUPERACION_BACKOFF_MAX=${SAGA_RECUPERACION_BACKOFF_MAX:-60}
    depends_on:
      catalogo:
        condition: service_healthy
    networks:
      - biblioteca_net
    # Liveness: /health sigue informando por separado el estado de dependencias.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  sanciones:
    build:
      context: .
      dockerfile: sanciones_service/Dockerfile
    volumes:
      - sanciones_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/sanciones.db
    networks:
      - biblioteca_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: gateway_service/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - PRESTAMOS_URL=http://prestamos:8000
      - API_KEY=${API_KEY:-biblioteca_dev_key_2026}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_cambiar}
      - GATEWAY_TIMEOUT_SEGS=${GATEWAY_TIMEOUT_SEGS:-10}
      - SAGA_TIMEOUT_SEGS=${SAGA_TIMEOUT_SEGS:-8}
      - RATE_LIMIT=${RATE_LIMIT:-20}
      - RATE_WINDOW=${RATE_WINDOW:-60}
    depends_on:
      prestamos:
        condition: service_healthy
    networks:
      - biblioteca_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  catalogo_data:
  prestamos_data:
  sanciones_data:

networks:
  biblioteca_net:
    driver: bridge
